<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- ====== غيّر عنوان التطبيق هنا ====== -->
<title>تطبيق جديد — المكتب الإداري للشيخ سعد علي آل عوضه</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Chart.js جاهز للوحات البيانات -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- Firebase (نسخة التوافق عبر CDN) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>

:root{
  --green:#0a2010; --green2:#0f2a16; --panel:#11331c; --line:#1d4a2c;
  --gold:#b8921a; --gold2:#d8b441; --cream:#f3ead0; --muted:#9db3a3;
  --ok:#2e9e5b; --warn:#c9a227; --bad:#c0532f; --info:#3a7bd5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#103019 0%,var(--green) 55%) fixed;
  color:var(--cream);min-height:100vh;direction:rtl;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
.topbar{display:flex;align-items:center;gap:18px;padding:18px 22px;border:1px solid var(--line);
  border-radius:18px;background:linear-gradient(180deg,#0d2614,#0a1d10);
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.topbar img{height:76px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.topttl{display:flex;flex-direction:column;gap:4px}
.topttl h1{margin:0;font-size:22px;font-weight:800;color:var(--cream);letter-spacing:.2px}
.topttl span{color:var(--gold2);font-size:13px;font-weight:600}
.gold-rule{height:2px;border:0;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px 0 18px}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;color:var(--gold2);
  letter-spacing:2px;border:1px solid var(--line);border-radius:999px;padding:5px 14px;background:#0c2413}
h2.sec{font-size:18px;font-weight:800;margin:14px 0 14px;color:var(--cream)}
.card{background:linear-gradient(180deg,var(--panel),#0d2917);border:1px solid var(--line);
  border-radius:16px;padding:18px;transition:transform .15s ease,border-color .15s ease,box-shadow .15s}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);color:var(--gold2);
  background:#0c2413;border-radius:11px;padding:9px 16px;font-family:inherit;font-weight:700;
  font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--gold);color:#1a1405}
.btn.solid{background:var(--gold);color:#1a1405}
.muted{color:var(--muted);font-size:13px;line-height:1.9}
footer{margin-top:42px;text-align:center;color:var(--muted);font-size:12px;line-height:2}
@media(max-width:620px){.topbar img{height:56px}.topttl h1{font-size:18px}}

/* تخطيط القالب: شريط جانبي + محتوى */
.app{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.side{position:sticky;top:20px;background:linear-gradient(180deg,var(--panel),#0d2917);
  border:1px solid var(--line);border-radius:16px;padding:14px}
.side .navi{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.side .navi a{padding:10px 12px;border-radius:11px;color:var(--cream);font-weight:600;font-size:14px}
.side .navi a.on,.side .navi a:hover{background:#0a1f11;color:var(--gold2);border:1px solid var(--line)}
.content{min-height:60vh}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat{background:linear-gradient(180deg,var(--panel),#0d2917);border:1px solid var(--line);
  border-radius:14px;padding:16px}
.stat .l{color:var(--muted);font-size:13px}.stat .v{font-size:24px;font-weight:800;color:var(--gold2)}
table.data{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
table.data th{background:#0a1f11;color:var(--gold2);padding:11px;text-align:right}
table.data td{padding:10px 11px;border-top:1px solid var(--line)}
.save-ind{font-size:12px;color:var(--muted)}
.save-ind.ok{color:#7fd6a0}.save-ind.sync{color:var(--gold2)}
input,select{font-family:inherit;background:#08160d;border:1px solid var(--line);color:var(--cream);
  border-radius:10px;padding:9px 11px;font-size:14px}
@media(max-width:780px){.app{grid-template-columns:1fr}.side{position:static}.stat-row{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}}
</style>
<style>/* حد أقصى لحجم الشعار الموحّد لمنع تضخّمه في شاشات التحميل والطباعة */
img[src*="logo_green"],img[src*="logo_badge"]{max-height:96px;max-width:150px;height:auto;object-fit:contain}
@media print{img[src*="logo_green"],img[src*="logo_badge"]{max-height:70px}}</style>
</head>
<body>

<!-- ====== شاشة الدخول (مصادقة فايربيس) ====== -->
<div id="authGate" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#103019 0%,#0a2010 55%);direction:rtl;font-family:'Cairo',system-ui,sans-serif">
  <div style="width:min(92vw,380px);background:#11331c;border:1px solid #1d4a2c;border-radius:16px;padding:30px 24px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.5)">
    <img id="authLogo" alt="شعار المكتب" style="height:88px;margin-bottom:8px">
    <h2 style="color:#f3ead0;margin:6px 0 2px;font-size:19px;font-weight:800">المكتب الإداري للشيخ سعد علي آل عوضه</h2>
    <div style="color:#9db3a3;font-size:13px;margin-bottom:20px">تسجيل الدخول للمتابعة</div>
    <input id="authEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username" style="width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #1d4a2c;background:#0a2010;color:#f3ead0;font-family:inherit;font-size:14px;text-align:right;outline:none">
    <input id="authPass" type="password" placeholder="كلمة المرور" autocomplete="current-password" style="width:100%;padding:12px;margin-bottom:16px;border-radius:10px;border:1px solid #1d4a2c;background:#0a2010;color:#f3ead0;font-family:inherit;font-size:14px;text-align:right;outline:none">
    <button id="authBtn" style="width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(180deg,#d8b441,#b8921a);color:#0a2010;font-weight:800;font-family:inherit;font-size:15px;cursor:pointer">دخول</button>
    <div id="authMsg" style="color:#c0532f;font-size:13px;min-height:18px;margin-top:12px"></div>
  </div>
</div>
<div class="wrap">
  <div class="topbar">
    <img id="brandLogo" alt="شعار المكتب">
    <div class="topttl">
      <!-- ====== غيّر اسم التطبيق هنا ====== -->
      <h1>اسم التطبيق الجديد</h1>
      <span>المكتب الإداري للشيخ سعد علي آل عوضه</span>
    </div>
    <div style="margin-right:auto;display:flex;gap:10px;align-items:center">
      <span id="saveInd" class="save-ind">—</span>
      <button id="logoutBtn" title="تسجيل الخروج" style="padding:7px 13px;border:1px solid #1d4a2c;border-radius:9px;background:#0a2010;color:#9db3a3;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer">خروج</button>
      <button class="btn" onclick="shareWhatsApp()">مشاركة واتساب</button>
      <button class="btn solid" onclick="printReport()">طباعة / PDF</button>
    </div>
  </div>

  <hr class="gold-rule">

  <div class="app">
    <aside class="side">
      <div class="eyebrow">الأقسام</div>
      <nav class="navi">
        <a class="on" href="#">لوحة البيانات</a>
        <a href="#">السجلّ</a>
        <a href="#">التقارير</a>
      </nav>
    </aside>

    <main class="content">
      <div class="stat-row">
        <div class="stat"><div class="l">إجمالي السجلات</div><div class="v" id="s-count">0</div></div>
        <div class="stat"><div class="l">الإجمالي (ر.س)</div><div class="v" id="s-sum">0</div></div>
        <div class="stat"><div class="l">آخر تحديث</div><div class="v" id="s-time" style="font-size:15px">—</div></div>
      </div>

      <div class="card">
        <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <input id="i-name" placeholder="الوصف">
          <input id="i-amount" type="number" placeholder="المبلغ">
          <button class="btn solid" onclick="addRow()">إضافة</button>
        </div>
        <table class="data"><thead><tr><th>#</th><th>الوصف</th><th>المبلغ (ر.س)</th><th>إجراء</th></tr></thead>
        <tbody id="tbody"></tbody></table>
      </div>

      <div class="card" style="margin-top:16px">
        <canvas id="chart" height="110"></canvas>
      </div>
    </main>
  </div>

  <footer>قالب بداية موحّد — انسخه وابنِ عليه أي تطبيق جديد للمكتب.</footer>
</div>

<script>
/* ============================================================
   قالب بداية تطبيقات المكتب الإداري للشيخ سعد علي آل عوضه
   انسخ هذا الملف وابدأ منه. عدّل القيم المعلّمة بـ "غيّر".
   ============================================================ */

/* (1) ----- الشعار الرسمي (يُستخدم في الهيدر وفي نافذة الطباعة) ----- */
var LOGO = "logo_green.png?v=2";
document.getElementById('brandLogo').src = 'logo_green.png?v=2';

/* (2) ----- إعدادات فايربيس (ثابتة لكل تطبيقات المكتب) ----- */
var FB_CFG = { 
  apiKey:"AIzaSyBnbzqr2VL-oa9fENHF53thIXrdzDzqEaA",
  authDomain:"my-apps-4544f.firebaseapp.com",
  projectId:"my-apps-4544f",
  storageBucket:"my-apps-4544f.appspot.com",
  messagingSenderId:"956890008527",
  appId:"1:956890008527:web:c862fe7f1da7b62f62e0ba"
 };
/* غيّر اسم المجموعة والوثيقة لكل تطبيق حتى لا تتداخل البيانات */
var FB_COLLECTION = "app_template_db";   // <== غيّر
var FB_DOC        = "main";
var LS_KEY        = "APP_TEMPLATE_DATA";  // <== غيّر مفتاح التخزين المحلي

/* (3) ----- الحالة ----- */
var rows = [];     // بيانات التطبيق
var saveTimer = null;

/* (4) ----- التحميل: محلي أولاً، ثم مزامنة فايربيس في الخلفية ----- */
function loadData(){
  try{ rows = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }catch(e){ rows = []; }
  render();
  setInd("محفوظ محلياً", "ok");
  // مزامنة من فايربيس في الخلفية (تحديث إن وُجد أحدث)
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
    firebase.firestore().collection(FB_COLLECTION).doc(FB_DOC).get().then(function(d){
      if(d.exists && d.data() && Array.isArray(d.data().rows)){
        rows = d.data().rows; localStorage.setItem(LS_KEY, JSON.stringify(rows)); render();
        setInd("مُزامن مع فايربيس", "ok");
      }
    }).catch(function(){});
  }catch(e){}
}

/* (5) ----- الحفظ: محلي فوري + فايربيس مؤجّل (debounce) ----- */
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(rows));
  setInd("يحفظ…", "sync");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{
      if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
      firebase.firestore().collection(FB_COLLECTION).doc(FB_DOC)
        .set({ rows: rows, updatedAt: new Date().toISOString() })
        .then(function(){ setInd("مُزامن مع فايربيس", "ok"); })
        .catch(function(){ setInd("محفوظ محلياً (دون اتصال)", "ok"); });
    }catch(e){ setInd("محفوظ محلياً", "ok"); }
  }, 1200);
}
function setInd(t, cls){ var e=document.getElementById('saveInd'); e.textContent=t; e.className='save-ind '+(cls||''); }

/* (6) ----- العرض + الإحصائيات + الرسم ----- */
var chart=null;
function render(){
  var tb=document.getElementById('tbody'), html='';
  rows.forEach(function(r,i){
    html+='<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+(Number(r.amount)||0).toLocaleString('en-US')+'</td>'+
          '<td><button class="btn" onclick="delRow('+i+')">حذف</button></td></tr>';
  });
  tb.innerHTML = html || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">لا توجد سجلات — أضف الأول</td></tr>';
  var sum=rows.reduce(function(s,r){return s+(Number(r.amount)||0);},0);
  document.getElementById('s-count').textContent=rows.length;
  document.getElementById('s-sum').textContent=sum.toLocaleString('en-US');
  document.getElementById('s-time').textContent=new Date().toLocaleDateString('ar-SA');
  drawChart();
}
function drawChart(){
  var ctx=document.getElementById('chart');
  var labels=rows.map(function(r){return r.name;}), data=rows.map(function(r){return Number(r.amount)||0;});
  if(chart) chart.destroy();
  chart=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[{label:'المبلغ',data:data,
    backgroundColor:'rgba(184,146,26,.65)',borderColor:'#d8b441',borderWidth:1}]},
    options:{plugins:{legend:{labels:{color:'#f3ead0'}}},
      scales:{x:{ticks:{color:'#9db3a3'}},y:{ticks:{color:'#9db3a3'}}}}});
}
/* تأمين النص (مهم في الأسماء العربية وعلامات HTML) */
function esc(s){ return String(s==null?'':s).split('<').join('&lt;').split('>').join('&gt;'); }

/* (7) ----- إضافة / حذف ----- */
function addRow(){
  var n=document.getElementById('i-name').value.trim();
  var a=document.getElementById('i-amount').value;
  if(!n){ alert('اكتب الوصف'); return; }
  rows.push({name:n, amount:Number(a)||0});
  document.getElementById('i-name').value=''; document.getElementById('i-amount').value='';
  render(); save();
}
function delRow(i){ if(confirm('حذف هذا السجل؟')){ rows.splice(i,1); render(); save(); } }

/* (8) ----- مشاركة واتساب ----- */
function shareWhatsApp(){
  var sum=rows.reduce(function(s,r){return s+(Number(r.amount)||0);},0);
  var txt='تقرير سريع — المكتب الإداري للشيخ سعد علي آل عوضه%0A';
  txt+='عدد السجلات: '+rows.length+'%0A';
  txt+='الإجمالي: '+sum.toLocaleString('en-US')+' ر.س';
  window.open('https://wa.me/?text='+txt, '_blank');
}

/* (9) ----- الطباعة / PDF -----
   نبني نافذة مستقلة ونُضمّن الشعار بقيمته كاملة (لا نعتمد على نطاق المتغيرات في window.open) */
function printReport(){
  var sum=rows.reduce(function(s,r){return s+(Number(r.amount)||0);},0);
  var body=rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+(Number(r.amount)||0).toLocaleString('en-US')+'</td></tr>';}).join('');
  var LOGO_PRINT = "logo_badge.png?v=2"; // مضمّن صراحةً هنا
  var w=window.open('', '_blank');
  var doc='<!doctype html><html lang=ar dir=rtl><head><meta charset=utf-8>'+
    '<title>تقرير المكتب الإداري</title>'+
    "<style>body{font-family:Cairo,Arial;padding:30px;color:#0a2010}"+
    ".h{text-align:center;border-bottom:3px solid #b8921a;padding-bottom:14px;margin-bottom:18px}"+
    ".h img{height:90px}.h h2{margin:8px 0 0;color:#0a2010}"+
    "table{width:100%;border-collapse:collapse;margin-top:10px}"+
    "th{background:#0a2010;color:#fff;padding:10px}td{padding:9px;border:1px solid #ccc}"+
    ".tot{margin-top:16px;font-weight:800;font-size:18px;color:#0a2010}</style></head><body>"+
    '<div class=h><img src="'+LOGO_PRINT+'"><h2>المكتب الإداري للشيخ سعد علي آل عوضه</h2></div>'+
    '<table><thead><tr><th>#</th><th>الوصف</th><th>المبلغ (ر.س)</th></tr></thead><tbody>'+body+'</tbody></table>'+
    '<div class=tot>الإجمالي: '+sum.toLocaleString('en-US')+' ر.س</div>'+
    '<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},300);}</scr'+'ipt>'+
    '</body></html>';
  w.document.write(doc); w.document.close();
}

/* (10) ----- بدء التشغيل: يتطلب تسجيل الدخول ----- */
(function(){
  try{ if(!firebase.apps.length) firebase.initializeApp(FB_CFG); }catch(e){}
  var _auth = firebase.auth();
  try{ _auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  var gate = document.getElementById('authGate');
  var booted = false;
  try{ var lg=document.getElementById('authLogo'); if(lg) lg.src='logo_green.png?v=2'; }catch(e){}
  function showGate(){ if(gate) gate.style.display='flex'; }
  function hideGate(){ if(gate) gate.style.display='none'; }
  _auth.onAuthStateChanged(function(user){
    if(user){ hideGate(); if(!booted){ booted=true; loadData(); } }
    else { showGate(); }
  });
  function doLogin(){
    var em=(document.getElementById('authEmail').value||'').trim();
    var pw=document.getElementById('authPass').value||'';
    var msg=document.getElementById('authMsg'), btn=document.getElementById('authBtn');
    if(!em||!pw){ msg.textContent='أدخل البريد وكلمة المرور'; return; }
    msg.textContent=''; btn.disabled=true; btn.textContent='جارٍ الدخول…';
    _auth.signInWithEmailAndPassword(em,pw).catch(function(err){
      var code = err && err.code ? err.code : '';
      var m='تعذّر تسجيل الدخول';
      if(code==='auth/wrong-password'||code==='auth/invalid-credential'||code==='auth/user-not-found') m='البريد أو كلمة المرور غير صحيحة';
      else if(code==='auth/invalid-email') m='صيغة البريد غير صحيحة';
      else if(code==='auth/too-many-requests') m='محاولات كثيرة، حاول لاحقًا';
      else if(code==='auth/network-request-failed') m='تعذّر الاتصال بالشبكة';
      msg.textContent=m;
    }).finally(function(){ btn.disabled=false; btn.textContent='دخول'; });
  }
  var ab=document.getElementById('authBtn'); if(ab) ab.addEventListener('click',doLogin);
  var ap=document.getElementById('authPass'); if(ap) ap.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
  var lo=document.getElementById('logoutBtn'); if(lo) lo.addEventListener('click',function(){ _auth.signOut(); });
})();
</script>
</body>
</html>
