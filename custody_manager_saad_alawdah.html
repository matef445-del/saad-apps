<style>
:root{--bg1:#06240c;--bg2:#06240c;--panel:#11331c;--line:#1d4a2c;--gold:#b8921a;--gold2:#d8b441;--cream:#f3ead0;--muted:#9db3a3;--green:#3a7d44;--blue:#2f6db3;--red:#cf5050;--gray:#7e9387;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:radial-gradient(1100px 600px at 50% -10%,#103019,#06240c 60%);color:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(6,36,12,.6);backdrop-filter:blur(8px);position:sticky;top:0;z-index:50;flex-wrap:wrap}
header img{max-height:48px;max-width:110px;object-fit:contain}
header .h-t{font-weight:800;font-size:15px;color:var(--cream)}
header .h-s{font-size:11px;color:var(--muted)}
.hspacer{margin-inline-start:auto}
.langbtn{font-family:inherit;font-weight:800;font-size:12.5px;background:rgba(255,255,255,.05);color:var(--gold2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.langbtn:hover{border-color:var(--gold)}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);padding:6px 12px;border-radius:20px;border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gray)}
.dot.ok{background:#4ade80;box-shadow:0 0 8px #4ade80}.dot.sv{background:var(--gold2);animation:pulse 1s infinite}.dot.off{background:var(--red)}
@keyframes pulse{50%{opacity:.4}}
nav{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
.nb{white-space:nowrap;background:rgba(255,255,255,.03);color:var(--muted);border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:.2s}
.nb:hover{color:var(--cream);border-color:var(--gold)}
.nb.act{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206;border-color:transparent;font-weight:800}
main{padding:18px;max-width:1200px;margin:0 auto}
.pg{display:none}.pg.act{display:block}
.pgh{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.pgh h1{font-size:20px;color:var(--cream);font-weight:800}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:inherit;font-weight:700;font-size:13.5px;border:1px solid transparent;border-radius:12px;padding:10px 16px;cursor:pointer;transition:.2s}
.btn.sm{padding:8px 13px;font-size:12.5px}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--cream);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.red{background:rgba(207,80,80,.15);color:#f0a8a8;border-color:rgba(207,80,80,.4)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--accent,var(--gold))}
.card .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.card .val{font-size:23px;font-weight:800;color:var(--cv,var(--cream))}
.card .val .u{font-size:13px;color:var(--muted);font-weight:600}
.card .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.minibar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.minibar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.sec h2{font-size:16px;color:var(--gold2);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.divider{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px 0;opacity:.5}
.hint{font-size:12px;color:var(--muted);line-height:1.7}
label.fl{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
select,input,textarea{font-family:inherit;background:rgba(255,255,255,.05);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;width:100%}
select:focus,input:focus{outline:none;border-color:var(--gold)}
select option{background:var(--bg2);color:var(--cream)}
.row-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.msel{position:relative;display:inline-block}
.msel-btn{font-family:inherit;background:rgba(255,255,255,.05);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;min-width:150px;max-width:260px;text-align:start;display:flex;align-items:center;gap:8px;justify-content:space-between}
.msel-btn .cap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msel-btn .arw{color:var(--muted);font-size:10px}
.msel.open .msel-btn{border-color:var(--gold)}
.msel-panel{position:absolute;z-index:60;top:calc(100% + 4px);inset-inline-end:0;min-width:200px;max-height:300px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:none;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.msel.open .msel-panel{display:block}
.msel-opt{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;font-size:13px;color:var(--cream);cursor:pointer;white-space:nowrap}
.msel-opt:hover{background:rgba(255,255,255,.06)}.msel-opt input{width:16px;height:16px;accent-color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:start;color:var(--gold2);font-weight:700;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.tbl td{padding:10px;border-bottom:1px solid rgba(29,74,44,.5);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.02)}.tbl .num{font-weight:700}
.tblwrap{overflow-x:auto}.pos{color:#7fdca0}.neg{color:#f0a8a8}.warnv{color:var(--gold2)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tagp{background:rgba(47,109,179,.2);color:#bcd4f0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:900;padding:16px}
.ov.show{display:flex}
.ovbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(94vw,480px);max-height:90vh;overflow:auto}
.ovbox h3{color:var(--gold2);font-size:17px;margin-bottom:16px}.ovbox .fld{margin-bottom:12px}
.ovfoot{display:flex;gap:10px;margin-top:18px}
#toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:#06240c;border:1px solid var(--gold);color:var(--cream);padding:12px 22px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:99999;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1}
img[src*="logo_green"],img[src*="logo_badge"]{max-height:96px;max-width:150px;height:auto;object-fit:contain}
#printhead{display:none;text-align:center;margin-bottom:16px}#printhead img{width:120px}#printhead .pt{font-weight:800;font-size:16px;margin-top:6px;color:#1a3a1a}#printhead #phsub{font-size:12px;color:#444;margin-top:3px}
@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body{background:#fff!important;color:#111!important}header,nav,.tools,.no-print,#authLogoutBtn,.ov{display:none!important}main{padding:0;max-width:100%}.pg{display:none!important}.pg.printme{display:block!important}#printhead{display:block!important}#printhead img{background:#06240c;padding:12px;border-radius:14px}.sec,.card{border-color:#ccc!important;background:#fff!important}.tbl th{color:#06240c!important}.tbl td,.tbl th{border-color:#ccc!important}img[src*="logo_green"],img[src*="logo_badge"]{max-height:70px}}

<nav id="nav"></nav>
<main>
  <div id="printhead"><img src="logo_green.png?v=4"><div class="pt" data-i18n="office">المكتب الإداري للشيخ سعد علي آل عوضه</div><div id="phsub"></div></div>

  <div class="pg act" id="pg-dash">
    <div class="pgh"><h1 data-i18n="pg_dash">📊 لوحة المتابعة</h1>
      <div class="tools"><button class="btn gold sm" onclick="openExp()" data-i18n="btn_add_exp">＋ مصروف</button><button class="btn ghost sm" onclick="openDep()" data-i18n="btn_add_dep">＋ عهدة</button></div>
    </div>
    <div class="cards" id="dash-totals"></div>
    <div class="sec"><h2 data-i18n="per_person">👥 حسب الشخص</h2><div id="dash-people"></div></div>
  </div>

  <div class="pg" id="pg-exp">
    <div class="pgh"><h1 data-i18n="pg_exp">📁 كل المصروفات</h1>
      <div class="tools"><button class="btn gold sm" onclick="openExp()" data-i18n="btn_add_exp">＋ مصروف</button><button class="btn ghost sm" onclick="printPage('exp','pg_exp')" data-i18n="btn_print">🖨️ طباعة</button></div>
    </div>
    <div class="sec no-print"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div><label class="fl" data-i18n="f_person">الشخص</label><div class="msel" id="fx-src"></div></div>
      <div><label class="fl" data-i18n="f_month">الشهر</label><div class="msel" id="fx-month"></div></div>
      <div style="flex:1;min-width:160px"><label class="fl" data-i18n="f_search">بحث</label><input id="fx-q" data-i18n-ph="ph_search" placeholder="بحث في الوصف / المورّد / التصنيف" oninput="renderExp()"></div>
    </div></div>
    <div class="cards" id="exp-sum"></div>
    <div class="sec"><div class="tblwrap"><table class="tbl" id="exp-tbl"></table></div></div>
  </div>

  <div class="pg" id="pg-dep">
    <div class="pgh"><h1 data-i18n="pg_dep">💰 كل العُهد المستلمة</h1>
      <div class="tools"><button class="btn gold sm" onclick="openDep()" data-i18n="btn_add_dep">＋ عهدة</button><button class="btn ghost sm" onclick="printPage('dep','pg_dep')" data-i18n="btn_print">🖨️ طباعة</button></div>
    </div>
    <div class="sec"><div class="tblwrap"><table class="tbl" id="dep-tbl"></table></div></div>
  </div>

  <div class="pg" id="pg-stmt">
    <div class="pgh"><h1 data-i18n="pg_stmt">📄 كشف حساب</h1>
      <div class="tools no-print"><button class="btn ghost sm" onclick="printStmt()" data-i18n="btn_print_stmt">🖨️ طباعة الكشف</button></div>
    </div>

      <div><label class="fl" data-i18n="f_person">الشخص</label><select id="st-src" onchange="renderStmt()"></select></div>
      <div><label class="fl" data-i18n="f_period">الفترة</label><div class="msel" id="st-month"></div></div>
    </div></div>
    <div class="cards" id="stmt-sum"></div>
    <div class="sec"><div class="tblwrap"><table class="tbl" id="stmt-tbl"></table></div></div>
  </div>
</main>

  <div class="ovfoot"><button class="btn gold" onclick="saveDep()" data-i18n="btn_save">حفظ</button><button class="btn ghost" onclick="closeOv('ov-dep')" data-i18n="btn_cancel">إلغاء</button></div>
</div></div>

  (DATA[key].deposits||[]).forEach(function(d){ if(!fm.length||fm.indexOf(monthOf(d.date))>=0) items.push({date:d.date,type:t('dep_received'),desc:d.note||'',in:Number(d.amount)||0,out:0,created:d.created||0}); });
  (DATA[key].expenses||[]).forEach(function(e){ if(!fm.length||fm.indexOf(monthOf(e.date))>=0) items.push({date:e.date,type:e.cat||t('default_exp'),desc:e.desc||'',in:0,out:Number(e.amount)||0,created:e.created||0}); });
  items.sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||(a.created-b.created);});
  var tIn=0,tOut=0,run=0; var body=items.map(function(it){ tIn+=it.in;tOut+=it.out;run+=it.in-it.out;
    return '<tr><td>'+esc(it.date)+'</td><td>'+esc(it.type)+'</td><td>'+esc(it.desc)+'</td><td class="num pos">'+(it.in?money(it.in):'—')+'</td><td class="num warnv">'+(it.out?money(it.out):'—')+'</td><td class="num '+(run<0?'neg':'')+'">'+money(run)+'</td></tr>'; }).join('');
  g('stmt-sum').innerHTML=card(t('recv'),'+ '+money(tIn),t('u_sar'),'var(--blue)','#bcd4f0')+card(t('spent'),'- '+money(tOut),t('u_sar'),'var(--gold)','var(--gold2)')+card(t('remaining'),money(tIn-tOut),t('u_sar'),(tIn-tOut)<0?'var(--red)':'var(--green)',(tIn-tOut)<0?'#f0a8a8':'#7fdca0');
  var th='<thead><tr><th>'+t('th_date')+'</th><th>'+t('th_type')+'</th><th>'+t('th_det')+'</th><th>'+t('th_in')+'</th><th>'+t('th_out')+'</th><th>'+t('th_bal')+'</th></tr></thead>';
  g('stmt-tbl').innerHTML=th+'<tbody>'+(body||'<tr><td colspan="6" class="hint" style="text-align:center;padding:20px">'+t('no_move')+'</td></tr>')+'</tbody>';
}
function printStmt(){ var key=g('st-src').value, fm=mselValues('st-month'); g('phsub').textContent=t('statement_of')+': '+srcName(key)+' — '+(fm.length?fm.join('، '):t('all_periods')); printOnly('stmt'); }

/* msel */
var MSEL={};
function mselInit(id,items,opts){ opts=opts||{}; MSEL[id]={items:items,values:[],allLabel:opts.allLabel||'الكل',onChange:opts.onChange}; var el=g(id); if(!el)return; el.className='msel'; el.innerHTML='<button type="button" class="msel-btn"><span class="cap"></span><span class="arw">▾</span></button><div class="msel-panel"></div>';
  el.querySelector('.msel-btn').onclick=function(e){e.stopPropagation();var was=el.classList.contains('open');closeAllMsel();if(!was)el.classList.add('open');}; mselRenderPanel(id); mselUpdateBtn(id); }
function mselRenderPanel(id){ var st=MSEL[id],el=g(id);if(!st||!el)return; var p=el.querySelector('.msel-panel');var h='<div class="msel-opt" data-all="1"><input type="checkbox" '+(st.values.length===0?'checked':'')+'><span>'+esc(st.allLabel)+'</span></div>';
  st.items.forEach(function(it,idx){h+='<div class="msel-opt" data-i="'+idx+'"><input type="checkbox" '+(st.values.indexOf(it.value)>=0?'checked':'')+'><span>'+esc(it.label)+'</span></div>';}); p.innerHTML=h;
  p.querySelectorAll('.msel-opt').forEach(function(row){ row.onclick=function(){ if(row.getAttribute('data-all')){st.values=[];} else{var it=st.items[+row.getAttribute('data-i')];var k=st.values.indexOf(it.value);if(k>=0)st.values.splice(k,1);else st.values.push(it.value);} mselRenderPanel(id); mselUpdateBtn(id); if(st.onChange)st.onChange(); }; }); }
function mselUpdateBtn(id){ var st=MSEL[id],el=g(id);if(!st||!el)return; el.querySelector('.cap').textContent=st.values.length===0?st.allLabel:(st.values.length===1?labelOf(st,st.values[0]):(st.values.length+t('selected'))); }
function labelOf(st,v){var it=st.items.filter(function(x){return x.value===v;})[0];return it?it.label:v;}
function mselValues(id){return (MSEL[id]&&MSEL[id].values)||[];}
function closeAllMsel(){document.querySelectorAll('.msel.open').forEach(function(x){x.classList.remove('open');});}
document.addEventListener('click',function(){closeAllMsel();});

/* print / overlays */
function printOnly(k){ document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('printme');}); var pg=g('pg-'+k); if(pg)pg.classList.add('printme'); window.print(); setTimeout(function(){if(pg)pg.classList.remove('printme');},400); }
function printPage(k,tk){ g('phsub').textContent=tk?t(tk):''; printOnly(k); }
function closeOv(id){g(id).classList.remove('show');}
