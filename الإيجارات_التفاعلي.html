<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>برنامج إدارة الإيجارات — نسخة تفاعلية</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1a7a4c;--g2:#0f5c38;--gl:#e8f5ee;--ink:#1b2430;--mut:#6b7a8d;--line:#e4e9ef;--bg:#f4f7fa;--amber:#c8860a;--red:#c23b3b;--blue:#2563a8}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.08)}
header .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:6px 16px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand .logo{width:44px;height:44px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.brand h1{font-size:19px;font-weight:800}.brand p{font-size:12px;opacity:.9}
.hbtn{background:rgba(255,255,255,.16);border:none;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;display:none}
.hbtn:hover{background:rgba(255,255,255,.28)}.hbtn.show{display:inline-block}
.hero{text-align:center;padding:8px 0 4px}.hero h2{font-size:22px;color:var(--g2)}.hero p{color:var(--mut);font-size:14px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;cursor:pointer;transition:.18s}
.tile:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(20,80,50,.16);border-color:var(--g)}
.tile .ic{width:58px;height:58px;margin:0 auto 12px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--gl)}
.tile h3{font-size:16px;font-weight:700}.tile .n{font-size:24px;font-weight:800;color:var(--g);margin-top:6px}.tile .s{font-size:12px;color:var(--mut)}
.t-com .ic{background:#eef4fc}.t-fin .ic{background:#fff6e6}
.notif{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:20px}
.notif h3{font-size:16px;color:var(--g2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.badge-n{background:var(--red);color:#fff;font-size:12px;padding:1px 9px;border-radius:20px}
.nitem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.nitem:last-child{border-bottom:none}.nitem:hover{background:#fafcfe}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.d-red{background:var(--red)}.d-amber{background:var(--amber)}.d-blue{background:var(--blue)}.d-mut{background:var(--mut)}
.nitem .txt{flex:1;font-size:13.5px}.nitem .val{font-weight:700;font-size:13px;color:var(--mut)}
.search-row{margin:6px 0 10px;display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;padding:13px 44px 13px 16px;border:2px solid var(--line);border-radius:12px;font-size:15px;background:#fff;outline:none}
.search input:focus{border-color:var(--g)}
.search .ic{position:absolute;top:50%;right:14px;transform:translateY(-50%);font-size:17px;color:var(--mut)}
select{padding:11px 12px;border:2px solid var(--line);border-radius:12px;font-size:14px;background:#fff;cursor:pointer;font-family:inherit}
.vtitle{font-size:20px;font-weight:800;color:var(--g2);margin:6px 2px}
.count{color:var(--mut);font-size:13px;margin:4px 2px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{box-shadow:0 6px 22px rgba(20,60,40,.12);transform:translateY(-2px);border-color:var(--g)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card .tn{font-weight:700;font-size:15px}.card .pr{font-size:12.5px;color:var(--mut);margin-top:2px}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.b-com{background:#eef4fc;color:var(--blue)}.b-res{background:var(--gl);color:var(--g)}.b-vac{background:#fdeeee;color:var(--red)}
.card .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:6px}
.card .amt{font-weight:800;color:var(--g);font-size:16px}
.card .late{position:absolute;top:12px;left:12px;font-size:10.5px;background:#fdeeee;color:var(--red);padding:2px 7px;border-radius:12px;font-weight:700}
.vac{opacity:.72}
.fcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.fc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.fc .n{font-size:20px;font-weight:800}.fc .s{font-size:12.5px;color:var(--mut);margin-top:3px}
.fc.paid .n{color:var(--g)}.fc.late .n{color:var(--red)}.fc.up .n{color:var(--amber)}
table.ftab{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:6px}
table.ftab th{background:var(--g);color:#fff;padding:10px;text-align:right;font-weight:700}
table.ftab td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.ftab tr:hover td{background:#fafcfe;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(15,30,22,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.ov.on{display:flex}
.modal{background:#fff;max-width:780px;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mh{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mh h2{font-size:18px}.mh .sub{font-size:12.5px;opacity:.92;margin-top:3px}
.mh .x{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:20px;cursor:pointer;flex-shrink:0}
.mb{padding:20px 22px}
.sec{margin-bottom:20px}
.sec h3{font-size:13px;color:var(--g);font-weight:800;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--gl);display:flex;justify-content:space-between;align-items:center}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.rw{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.rw .k{color:var(--mut)}.rw .v{font-weight:600;text-align:left}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.pill.late{background:#fdeeee;color:var(--red)}.pill.up{background:#fff6e6;color:var(--amber)}.pill.ok{background:var(--gl);color:var(--g)}
table.sch{width:100%;border-collapse:collapse;font-size:13px}
table.sch th{background:var(--gl);color:var(--g2);padding:8px;text-align:right;font-weight:700}
table.sch td{padding:8px;border-bottom:1px solid var(--line)}
.st{font-size:11px;padding:2px 8px;border-radius:12px;font-weight:700}
.st-p{background:var(--gl);color:var(--g)}.st-l{background:#fdeeee;color:var(--red)}.st-u{background:#fff6e6;color:var(--amber)}
.st-d{background:#eef1f5;color:var(--mut)}
.linkbtn{background:var(--blue);color:#fff;border:none;padding:3px 10px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit}
.linkbtn:hover{opacity:.9}
.lf{background:#f7fafc;border:1px dashed var(--blue);border-radius:8px;padding:8px;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lf input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:inherit}
.note{font-size:11.5px;color:var(--mut);background:#fffdf5;border:1px solid #f0e6c8;padding:6px 10px;border-radius:8px;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:40px}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}.fcards{grid-template-columns:1fr}.rows{grid-template-columns:1fr}}
</style></head>

function listView(title,filt){
  el('backBtn').classList.add('show');curFilter=filt;
  el('app').innerHTML='<div class="vtitle">'+title+'</div><div class="search-row"><div class="search"><span class="ic">🔍</span><input id="q" placeholder="ابحث باسم المستأجر، رقم الوحدة، رقم العقد، المبلغ..."></div><select id="fStat"><option value="">كل الحالات</option><option value="occ">مشغول</option><option value="vac">شاغر</option></select></div><div class="count" id="count"></div><div class="grid" id="grid"></div>';
  el('q').addEventListener('input',renderList);el('fStat').addEventListener('change',renderList);renderList();window.scrollTo(0,0);
}
function renderList(){
  var q=(el('q').value||'').trim().toLowerCase(),fs=el('fStat').value;
  var list=DATA.filter(curFilter).filter(function(c){
    if(fs==='occ'&&!c.occupied)return false;if(fs==='vac'&&c.occupied)return false;
    if(q){var hay=[c.tenant,c.property,c.propertyLabel,c.contractNo,c.tenantCr,c.tenantId,(c.units||[]).join(' '),String(c.annual),c.type].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  el('count').textContent='عدد النتائج: '+list.length;
  el('grid').innerHTML=list.length?list.map(cardHTML).join(''):'<div class="empty">لا توجد نتائج</div>';
}
function cardHTML(c){
  var badge=!c.occupied?'<span class="badge b-vac">شاغر</span>':c.kind==='تجاري'?'<span class="badge b-com">تجاري</span>':'<span class="badge b-res">سكني</span>';
  var li=lateInfo(c);var late=li.amt>0?'<span class="late">متأخر '+fmt(li.amt)+' ﷼</span>':'';
  return '<div class="card '+(c.occupied?'':'vac')+'" onclick="openC('+c.id+')">'+late+'<div class="top"><div><div class="tn">'+(c.occupied?c.tenant:'وحدة شاغرة')+'</div><div class="pr">'+c.property+' · وحدة '+(c.units||[]).join('، ')+'</div></div>'+badge+'</div><div class="meta"><span>💰 <b class="amt">'+fmt(c.annual)+'</b> ﷼/سنة</span><span>📄 '+(c.type||'')+'</span>'+(c.contractNo?'<span>#'+c.contractNo+'</span>':'')+'</div></div>';
}

var tYear='',tMonth='',tQ='';
function collectedInPeriod(c,y,m){
  var arr=(c.payments||[]).filter(function(p){return p.status==='success';}).slice();
  var lk=window._links[c.id]||{};Object.keys(lk).forEach(function(k){arr.push(lk[k]);});
  arr=arr.filter(function(p){if(!p.date)return !y&&!m;if(y&&p.date.slice(0,4)!==y)return false;if(m&&p.date.slice(5,7)!==m)return false;return true;});
  return {amt:arr.reduce(function(s,p){return s+(p.amount||0);},0),n:arr.length};
}
function tenantsView(){
  el('backBtn').classList.add('show');
  var occ=DATA.filter(function(c){return c.occupied;});
  var years={};occ.forEach(function(c){(c.payments||[]).forEach(function(p){if(p.date)years[p.date.slice(0,4)]=1;});});
  var yopts='<option value="">كل الأعوام</option>'+Object.keys(years).sort().reverse().map(function(y){return '<option value="'+y+'"'+(y===tYear?' selected':'')+'>'+y+'</option>';}).join('');
  var mopts='<option value="">كل الأشهر</option>'+MO.map(function(m,i){var v=('0'+(i+1)).slice(-2);return '<option value="'+v+'"'+(v===tMonth?' selected':'')+'>'+m+'</option>';}).join('');
  var lbl=(tYear||tMonth)?('محصّل '+(tMonth?MO[parseInt(tMonth)-1]+' ':'')+(tYear||'')):'إجمالي المحصّل';
  el('app').innerHTML='<div class="vtitle">المستأجرون والدفعات</div>'+
    '<div class="search-row"><div class="search"><span class="ic">🔍</span><input id="q" placeholder="ابحث باسم المستأجر أو العقار..."></div>'+
    '<select id="ty" onchange="tYear=this.value;drawTenants()">'+yopts+'</select>'+
    '<select id="tm" onchange="tMonth=this.value;drawTenants()">'+mopts+'</select></div>'+
    '<div class="count" id="count"></div><div class="grid" id="grid"></div>';
  el('q').value=tQ;el('q').addEventListener('input',function(){tQ=this.value;drawTenants();});
  drawTenants();window.scrollTo(0,0);
}
function drawTenants(){
  var occ=DATA.filter(function(c){return c.occupied;});
  var q=(tQ||'').trim().toLowerCase();
  if(q)occ=occ.filter(function(c){return (c.tenant+' '+c.property).toLowerCase().indexOf(q)>=0;});
  var lbl=(tYear||tMonth)?('محصّل '+(tMonth?MO[parseInt(tMonth)-1]+' ':'')+(tYear||'')):'إجمالي المحصّل';
  var tot=0;var html=occ.map(function(c){
    var cp=collectedInPeriod(c,tYear,tMonth);tot+=cp.amt;
    var badge=c.kind==='تجاري'?'<span class="badge b-com">تجاري</span>':'<span class="badge b-res">سكني</span>';
    return '<div class="card" onclick="openC('+c.id+')"><div class="top"><div><div class="tn">'+c.tenant+'</div><div class="pr">'+c.property+' · وحدة '+c.units.join('، ')+'</div></div>'+badge+'</div>'+
      '<div class="meta"><span>💰 '+fmt(c.annual)+' ﷼/سنة</span><span style="color:var(--g);font-weight:700">✓ '+lbl+': '+fmt(cp.amt)+' ﷼</span><span>('+cp.n+' حوالة)</span></div></div>';
  }).join('');
  el('count').textContent='عدد المستأجرين: '+occ.length+' · إجمالي '+lbl+': '+fmt(tot)+' ﷼';
  el('grid').innerHTML=occ.length?html:'<div class="empty">لا نتائج</div>';
}
function propView(){
  el('backBtn').classList.add('show');
  var byp={};DATA.forEach(function(c){(byp[c.property]=byp[c.property]||[]).push(c);});
  var h='<div class="vtitle">العقارات</div><div class="grid">';
  Object.keys(byp).forEach(function(p){var arr=byp[p];var occ=arr.filter(function(c){return c.occupied;}).length;var ann=arr.reduce(function(s,c){return s+(c.occupied?c.annual:0);},0);
    h+='<div class="card" onclick="listProp(\''+p.replace(/\x27/g,"")+'\')"><div class="top"><div class="tn">'+p+'</div><span class="badge b-res">'+arr.length+' وحدة</span></div><div class="meta"><span>👥 '+occ+' مشغول</span><span>🔑 '+(arr.length-occ)+' شاغر</span><span>💰 <b class="amt">'+fmt(ann)+'</b> ﷼</span></div></div>';});
  h+='</div>';el('app').innerHTML=h;window.scrollTo(0,0);
}
function listProp(p){listView('عقار: '+p,function(c){return c.property===p;});}

// ---- all received payments (flatten) for period view ----
function allPayments(){
  var out=[];
  DATA.forEach(function(c){
    (c.payments||[]).forEach(function(p){if(p.status==='success')out.push({tenant:c.tenant,property:c.property,id:c.id,date:p.date,amount:p.amount,receipt:p.receipt,src:p.src});});
    // include manual links
    var lk=window._links[c.id]||{};Object.keys(lk).forEach(function(k){var p=lk[k];out.push({tenant:c.tenant,property:c.property,id:c.id,date:p.date,amount:p.amount,receipt:p.receipt||'يدوي',src:'ربط يدوي'});});
  });
  out.sort(function(a,b){return (b.date||'')<(a.date||'')?-1:1;});
  return out;
}
var finYear='',finMonth='';
function finView(){
  el('backBtn').classList.add('show');
  var com=DATA.filter(function(c){return c.kind==='تجاري';});
  var res=DATA.filter(function(c){return c.kind==='سكني'&&c.occupied;});
  var cAnn=com.reduce(function(s,c){return s+c.annual;},0),rAnn=res.reduce(function(s,c){return s+c.annual;},0);
  var pays=allPayments();var years={};pays.forEach(function(p){if(p.date)years[p.date.slice(0,4)]=1;});
  var fp=pays.filter(function(p){if(finYear&&(!p.date||p.date.slice(0,4)!==finYear))return false;if(finMonth&&(!p.date||p.date.slice(5,7)!==finMonth))return false;return true;});
  var totalP=fp.reduce(function(s,p){return s+(p.amount||0);},0);
  var h='<div class="vtitle">المالية والمدفوعات</div>';
  h+='<div class="fcards"><div class="fc paid"><div class="n">'+fmt(cAnn+rAnn)+' ﷼</div><div class="s">إجمالي الدخل السنوي المتوقع</div></div>'+
     '<div class="fc"><div class="n" style="color:var(--g)">'+fmt(rAnn)+' ﷼</div><div class="s">سكني ('+res.length+' عقد)</div></div>'+
     '<div class="fc"><div class="n" style="color:var(--blue)">'+fmt(cAnn)+' ﷼</div><div class="s">تجاري ('+com.length+' عقد)</div></div></div>';
  // yearly breakdown (several years)
  var byYear={};pays.forEach(function(p){if(p.date){var y=p.date.slice(0,4);byYear[y]=(byYear[y]||0)+(p.amount||0);}});
  var ykeys=Object.keys(byYear).sort();
  if(ykeys.length){
    h+='<div class="fcards" style="grid-template-columns:repeat('+Math.min(ykeys.length+1,4)+',1fr)">';
    h+='<div class="fc" style="cursor:pointer;'+(finYear===''?'border-color:var(--g);':'')+'" onclick="finYear=\x27\x27;finMonth=\x27\x27;finView()"><div class="n" style="color:var(--ink)">'+fmt(ykeys.reduce(function(s,y){return s+byYear[y];},0))+' ﷼</div><div class="s">كل الأعوام</div></div>';
    ykeys.reverse().forEach(function(y){h+='<div class="fc" style="cursor:pointer;'+(finYear===y?'border-color:var(--g);background:var(--gl);':'')+'" onclick="finYear=\x27'+y+'\x27;finView()"><div class="n" style="color:var(--g)">'+fmt(byYear[y])+' ﷼</div><div class="s">مُحصّل '+y+'</div></div>';});
    h+='</div>';
  }
  // period filter
  var yopts='<option value="">كل الأعوام</option>'+Object.keys(years).sort().reverse().map(function(y){return '<option value="'+y+'"'+(y===finYear?' selected':'')+'>'+y+'</option>';}).join('');
  var mopts='<option value="">كل الأشهر</option>'+MO.map(function(m,i){var v=('0'+(i+1)).slice(-2);return '<option value="'+v+'"'+(v===finMonth?' selected':'')+'>'+m+'</option>';}).join('');
  h+='<div class="search-row" style="align-items:center"><b style="color:var(--g2)">الحوالات المستلمة</b> <select id="fy" onchange="finYear=this.value;finView()">'+yopts+'</select><select id="fm" onchange="finMonth=this.value;finView()">'+mopts+'</select><span class="count" style="margin:0">'+fp.length+' حوالة · إجمالي '+fmt(totalP)+' ﷼</span></div>';
  h+='<table class="ftab"><tr><th>المستأجر</th><th>العقار</th><th>التاريخ</th><th>المبلغ</th><th>الإيصال</th><th>المصدر</th></tr>';
  h+=fp.slice(0,300).map(function(p){return '<tr onclick="openC('+p.id+')"><td>'+p.tenant+'</td><td>'+p.property+'</td><td>'+(p.date||'-')+'</td><td style="color:var(--g);font-weight:700">'+fmt(p.amount)+'</td><td>'+(p.receipt||'-')+'</td><td>'+(p.src||'-')+'</td></tr>';}).join('');
  h+='</table>';
  if(!fp.length)h+='<div class="empty">لا توجد حوالات في هذه الفترة</div>';
  h+='<div class="note">الحوالات الفعلية المُستلمة (الإنماء/إيجار). استخدم الفلتر لعرض دفعات عام أو شهر محدّد. الأرقام قابلة للربط اليدوي من بطاقة كل مستأجر عند اكتشاف تحويل بنكي مباشر.</div>';
  el('app').innerHTML=h;window.scrollTo(0,0);
}

function openC(id){
  closeC();var c=DATA.filter(function(x){return x.id===id;})[0];if(!c)return;
  var h='<div class="mh"><div><h2>'+(c.occupied?c.tenant:'وحدة شاغرة')+'</h2><div class="sub">'+c.property+(c.propertyLabel?' · '+c.propertyLabel:'')+' · وحدة '+(c.units||[]).join('، ')+'</div></div><button class="x" onclick="closeC()">×</button></div><div class="mb">';
  var li=lateInfo(c);var pills='';
  if(li.amt>0)pills+='<span class="pill late">متأخر: '+fmt(li.amt)+' ﷼ ('+li.count+')</span> ';
  if(c.kind==='تجاري'){if(c.upAmt>0)pills+='<span class="pill up">قادم: '+fmt(c.upAmt)+' ﷼ ('+c.upCount+')</span> ';if(c.paidAmt>0)pills+='<span class="pill ok">مدفوع: '+fmt(c.paidAmt)+' ﷼ ('+c.paidCount+')</span> ';}
  else if(c.occupied){var s=resStats(c);if(s.up>0)pills+='<span class="pill up">قادم: '+fmt(0)+' ﷼ ('+s.up+')</span> ';if(s.paidA>0)pills+='<span class="pill ok">محصّل: '+fmt(s.paidA)+' ﷼ ('+s.paid+')</span> ';}
  if(c.occupied&&!pills)pills+='<span class="pill ok">نشط</span>';
  if(pills)h+='<div class="sec" style="border:none;padding:0">'+pills+'</div>';
  h+='<div class="sec"><h3>معلومات العقد</h3><div class="rows">'+row('الحالة',c.occupied?'مشغول':'شاغر')+row('النوع',c.kind)+(c.contractNo?row('رقم العقد',c.contractNo):'')+row('نوع السداد',c.type||c.freq||'-')+(c.start?row('تاريخ البدء',c.start):'')+(c.end?row('تاريخ الانتهاء',c.end):'')+(c.unitType?row('نوع الوحدة',c.unitType):'')+(c.floor!=null?row('الطابق',c.floor):'')+(c.area?row('المساحة',c.area+' م²'):'')+'</div></div>';
  h+='<div class="sec"><h3>البيانات المالية</h3><div class="rows">'+row('الإيجار السنوي',fmt(c.annual)+' ﷼')+(c.monthlyReal?row('الإيجار الشهري الفعلي',fmt(c.monthlyReal)+' ﷼'):(c.kind==='سكني'&&c.occupied?row('الإيجار الشهري',fmt(Math.round(c.annual/12))+' ﷼'):''))+(c.paidReal?row('إجمالي المُحصّل الفعلي',fmt(c.paidReal)+' ﷼ ('+c.payCount+' حوالة)'):'')+(c.total?row('إجمالي قيمة العقد',fmt(c.total)+' ﷼'):'')+(c.tenantId?row('هوية المستأجر',c.tenantId):'')+(c.tenantCr?row('سجل تجاري المستأجر',c.tenantCr):'')+(c.tenantRep?row('ممثل المستأجر',c.tenantRep):'')+'</div></div>';
  if(c.landlord)h+='<div class="sec"><h3>المؤجر</h3><div class="rows">'+row('المؤجر',c.landlord.name)+row('السجل التجاري',c.landlord.cr)+row('الممثل',c.landlord.rep)+row('رقم الآيبان',c.landlord.iban)+'</div></div>';
  // COMMERCIAL: Ejar schedule
  if(c.kind==='تجاري'&&c.schedule&&c.schedule.length){
    h+='<div class="sec"><h3>تفاصيل الحوالات والدفعات ('+c.freq+')</h3><table class="sch"><tr><th>#</th><th>تاريخ الاستحقاق</th><th>المبلغ</th><th>الحالة</th></tr>';
    c.schedule.forEach(function(s){var cl=s.status==='مدفوعة'?'st-p':s.status==='متأخرة'?'st-l':'st-u';h+='<tr><td>'+s.no+'</td><td>'+s.date+'</td><td>'+fmt(s.amount)+' ﷼</td><td><span class="st '+cl+'">'+s.status+'</span></td></tr>';});
    h+='</table><div class="note">المصدر: منصة إيجار (حالة الدفع عبر المنصة).</div></div>';
  }
  // RESIDENTIAL: reconciliation (dues vs received) + link
  if(c.kind==='سكني'&&c.occupied&&c.dues&&c.dues.length){
    var d=reconcile(c);
    h+='<div class="sec"><h3>تسوية الحوالات (استحقاق ↔ مُستلم)</h3><table class="sch"><tr><th>#</th><th>الاستحقاق</th><th>المبلغ</th><th>الحالة</th><th>الحوالة / الإجراء</th></tr>';
    d.forEach(function(x){
      var cl=x.status==='مدفوعة'?'st-p':(x.status==='متأخرة'?'st-l':(x.status==='قادمة'?'st-u':'st-d'));
      var act='';
      if(x.status==='مدفوعة'&&x.pay){act=(x.manual?'🔗 ':'')+'حوالة '+(x.pay.date||'')+' · '+fmt(x.pay.amount)+' ﷼'+(x.pay.receipt?' · '+x.pay.receipt:'');}
      else if(x.status==='متأخرة'||x.status==='مستحقة'){act='<button class="linkbtn" onclick="showLink('+c.id+','+x.no+','+x.amount+')">🔗 ربط تحويل بنكي</button>';}
      h+='<tr><td>'+x.no+'</td><td>'+(x.date||'الشهر '+x.no)+'</td><td>'+fmt(x.amount)+' ﷼</td><td><span class="st '+cl+'">'+x.status+'</span></td><td id="act_'+c.id+'_'+x.no+'">'+act+'</td></tr>';
    });
    h+='</table><div class="note">الاستحقاق من العقد، والمُستلم من الحوالات الفعلية. إن ظهرت دفعة «متأخرة» راجع الحساب البنكي واربط التحويل المباشر بالزر.</div></div>';
    if(c.payments&&c.payments.length){
      h+='<div class="sec"><h3>سجل الحوالات الفعلية (المُستلمة)</h3><table class="sch"><tr><th>#</th><th>التاريخ</th><th>المبلغ</th><th>الإيصال</th><th>المصدر</th></tr>';
      c.payments.forEach(function(p,i){h+='<tr><td>'+(i+1)+'</td><td>'+(p.date||'-')+'</td><td>'+fmt(p.amount)+' ﷼</td><td>'+(p.receipt||'-')+'</td><td>'+(p.src||'-')+'</td></tr>';});
      h+='</table></div>';
    }
  }
  h+='</div>';el('modal').innerHTML=h;el('ov').classList.add('on');window._openId=id;
}
function showLink(cid,dueNo,amount){
  var cell=el('act_'+cid+'_'+dueNo);if(!cell)return;
  cell.innerHTML='<div class="lf"><input type="date" id="ld_'+cid+'_'+dueNo+'"><input type="number" id="la_'+cid+'_'+dueNo+'" value="'+amount+'" style="width:90px"><button class="linkbtn" onclick="doLink('+cid+','+dueNo+')">تأكيد الربط</button></div>';
}
function doLink(cid,dueNo){
  var dt=el('ld_'+cid+'_'+dueNo).value,am=parseFloat(el('la_'+cid+'_'+dueNo).value)||0;
  if(!dt){alert('اختر تاريخ التحويل');return;}
  window._links[cid]=window._links[cid]||{};
  window._links[cid][dueNo]={date:dt,amount:am,receipt:'تحويل بنكي مباشر',manual:true};
  openC(cid); // re-render
}
function row(k,v){return '<div class="rw"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';}
function closeC(){el('ov').classList.remove('on');}
el('ov').addEventListener('click',function(e){if(e.target===el('ov'))closeC();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeC();});
goHome();
</script></body></html>
