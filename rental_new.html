<style>
:root{--bg1:#103019;--bg2:#0a2010;--panel:#11331c;--line:#1d4a2c;--gold:#b8921a;--gold2:#d8b441;--cream:#f3ead0;--muted:#9db3a3;--green:#3a7d44;--red:#cf5050;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}
#splash{position:fixed;inset:0;background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
#splash img{width:180px;max-width:55vw;filter:drop-shadow(0 8px 26px rgba(0,0,0,.6))}
#splash .t{margin-top:14px;color:var(--gold2);font-weight:800;font-size:18px}
header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(10,32,16,.6);backdrop-filter:blur(8px);position:sticky;top:0;z-index:50}
header img{width:46px;height:46px;object-fit:contain}
header .ht{font-weight:800;font-size:16px}header .hs{font-size:11.5px;color:var(--muted)}
.sync{margin-inline-start:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);padding:6px 12px;border-radius:20px;border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:#7e9387}.dot.ok{background:#4ade80;box-shadow:0 0 8px #4ade80}.dot.sv{background:var(--gold2);animation:pulse 1s infinite}.dot.off{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
nav{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{height:5px}nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.nb{white-space:nowrap;background:rgba(255,255,255,.03);color:var(--muted);border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:.2s}
.nb:hover{color:var(--cream);border-color:var(--gold)}
.nb.act{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206;border-color:transparent;font-weight:800}
main{padding:20px 16px 70px;max-width:1200px;margin:0 auto}
.pg{display:none;animation:fade .3s}.pg.act{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.pgh{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.pgh h1{font-size:21px;font-weight:800}.pgh .tools{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card .lb{color:var(--muted);font-size:12.5px;margin-bottom:7px}.card .vl{font-size:22px;font-weight:800;color:var(--gold2)}
.card .vl.g{color:#5bd07a}.card .vl.r{color:#e06a6a}.card .vl.c{color:var(--cream)}
.btn{background:rgba(255,255,255,.05);color:var(--cream);border:1px solid var(--line);padding:9px 15px;border-radius:11px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--gold)}.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206;border-color:transparent}
.btn.red{background:rgba(207,80,80,.14);border-color:#5a2020;color:#e79191}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--gold2);font-weight:700;font-size:12.5px;white-space:nowrap}
tr:hover td{background:rgba(255,255,255,.02)}
.tablewrap{overflow-x:auto}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge.on{background:rgba(74,222,128,.15);color:#7ee6a0}.badge.off{background:rgba(207,80,80,.15);color:#e79191}.badge.due{background:rgba(216,180,65,.15);color:var(--gold2)}.badge.mnt{background:rgba(216,180,65,.1);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px;font-size:14px}
label.fld{display:block;margin-bottom:11px;font-size:12.5px;color:var(--muted)}label.fld span{display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--cream);font-family:inherit;font-size:13.5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:#11331c;color:#f3ead0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500;padding:16px}.modal.act{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;width:min(94vw,560px);max-height:90vh;overflow:auto}
.modal h3{color:var(--gold2);margin-bottom:16px;font-size:17px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#11331c;border:1px solid var(--gold);color:var(--cream);padding:11px 20px;border-radius:12px;font-size:13.5px;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:.3s}.toast.show{opacity:1}
.propcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.propcard .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.propcard .ph h3{font-size:16px;color:var(--cream)}.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);padding:3px 10px;border-radius:20px;font-size:11px;color:var(--muted)}
.subtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
</style>
<style>/* حد أقصى لحجم الشعار الموحّد لمنع تضخّمه في شاشات التحميل والطباعة */
img[src*="logo_green"],img[src*="logo_badge"]{max-height:96px;max-width:150px;height:auto;object-fit:contain}
@media print{img[src*="logo_green"],img[src*="logo_badge"]{max-height:70px}}</style>
</head>

<main>
  <section class="pg act" id="pg-dash"><div class="pgh"><h1>لوحة الإيجارات</h1></div><div class="cards" id="dashCards"></div>

  <section class="pg" id="pg-props"><div class="pgh"><h1>العقارات والوحدات</h1><div class="tools"><button class="btn gold" onclick="openProp()">+ عقار جديد</button><button class="btn" onclick="document.getElementById('ejarFile').click()">📥 استيراد بيانات المنصة (إيجار)</button><input type="file" id="ejarFile" accept=".xlsx,.xls" style="display:none"><span id="ejarMsg" style="color:var(--muted);font-size:12px;align-self:center"></span></div></div><div id="propsList"></div></section>

<script>
var FB={projectId:"my-apps-4544f",apiKey:"AIzaSyBnbzqr2VL-oa9fENHF53thIXrdzDzqEaA",authDomain:"my-apps-4544f.firebaseapp.com",storageBucket:"my-apps-4544f.appspot.com",messagingSenderId:"956890008527",appId:"1:956890008527:web:c862fe7f1da7b62f62e0ba"};
var COLLECTION='rental_mgmt_db',DOCID='state',LSKEY='SAAD_RENTAL_MGMT_V1';
var db=null,fbReady=false,saveTimer=null,propChart=null,_bkFil='all';
var ACCOUNTS_SEED=[{iban:'SA8380000504608016668882',label:'منصة إيجار'},{iban:'SA2480000504608010859644',label:'حساب 859644'},{iban:'SA9005000068203034643003',label:'الإنماء 4643003'},{iban:'SA7205000068203438009000',label:'الإنماء 8009000'}];
var STATE={properties:[],units:[],tenants:[],payments:[],bank:[],bankNames:{},accounts:JSON.parse(JSON.stringify(ACCOUNTS_SEED))};
var CYCLES=['شهري','ربع سنوي','نصف سنوي','سنوي','دفعة واحدة'];

function g(id){return document.getElementById(id);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function f(n){n=Number(n)||0;return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fd(d){if(!d)return'';var m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[3]+'/'+m[2]+'/'+m[1];try{var x=new Date(d);if(isNaN(x))return esc(d);return ('0'+x.getDate()).slice(-2)+'/'+('0'+(x.getMonth()+1)).slice(-2)+'/'+x.getFullYear();}catch(e){return esc(d);}}
function today(){return new Date().toISOString().slice(0,10);}
function toast(m){var t=g('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function sum(a,k){return a.reduce(function(s,x){return s+(Number(x[k])||0);},0);}
function _norm(s){return String(s||'').replace(/[أإآ]/g,'ا').replace(/\s+/g,'').toLowerCase();}
function monthly(rent,cycle){rent=Number(rent)||0;if(cycle==='ربع سنوي')return rent/3;if(cycle==='نصف سنوي')return rent/6;if(cycle==='سنوي')return rent/12;if(cycle==='دفعة واحدة')return 0;return rent;}
/* ===== firebase / sync ===== */
function setSync(s){var d=g('sdot'),t=g('stext');d.className='dot';if(s==='ok'){d.classList.add('ok');t.textContent='متصل — محفوظ سحابياً';}else if(s==='sv'){d.classList.add('sv');t.textContent='جارٍ الحفظ…';}else if(s==='off'){d.classList.add('off');t.textContent='غير متصل — محلي';}else t.textContent='جارٍ الاتصال…';}
function _rc(s){try{return (s.properties||[]).length+(s.units||[]).length+(s.tenants||[]).length+(s.payments||[]).length;}catch(e){return -1;}}
function initFB(){try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();fbReady=true;
  db.collection(COLLECTION).doc(DOCID).get().then(function(doc){var cloud=null;
    if(doc.exists&&doc.data()&&doc.data().payload){try{var p=JSON.parse(doc.data().payload);if(p&&p.properties)cloud=p;}catch(e){}}
    var local=null;try{var l=localStorage.getItem(LSKEY);if(l){var lp=JSON.parse(l);if(lp&&lp.properties)local=lp;}}catch(e){}
    if(cloud&&local&&_rc(local)>_rc(cloud)){STATE=norm(local);setSync('ok');afterLoad();pushCloud();return;}
    if(cloud){STATE=norm(cloud);setSync('ok');afterLoad();return;}
    loadLocalOrSeed();setSync('ok');pushCloud();
  }).catch(function(){setSync('off');loadLocalOrSeed();});
}catch(e){setSync('off');loadLocalOrSeed();}}
function norm(s){s.properties=s.properties||[];s.units=s.units||[];s.tenants=s.tenants||[];s.payments=s.payments||[];s.bank=s.bank||[];s.bankNames=s.bankNames||{};if(!s.accounts||!s.accounts.length)s.accounts=JSON.parse(JSON.stringify(ACCOUNTS_SEED));return s;}
function loadLocalOrSeed(){try{var l=localStorage.getItem(LSKEY);if(l){var p=JSON.parse(l);if(p.properties){STATE=norm(p);afterLoad();return;}}}catch(e){}afterLoad();saveLocal();}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(STATE));}catch(e){}}
function pushCloud(){if(!fbReady||!db)return;var payload;try{payload=JSON.stringify(STATE);}catch(e){setSync('off');return;}db.collection(COLLECTION).doc(DOCID).set({payload:payload,updated:Date.now()}).then(function(){setSync('ok');}).catch(function(){setSync('off');});}
function persist(){saveLocal();renderAll();if(fbReady){setSync('sv');clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,1200);}}
/* ===== nav ===== */
document.querySelectorAll('.nb').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.nb').forEach(function(x){x.classList.remove('act');});b.classList.add('act');document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('act');});g('pg-'+b.dataset.pg).classList.add('act');renderAll();});});

/* ===== helpers ===== */
function tenantName(id){var t=STATE.tenants.find(function(x){return x.id===id;});return t?t.name:'';}

function renderDash(){
  var occ=STATE.units.filter(function(u){return u.status==='مؤجرة';}).length;
  var vac=STATE.units.filter(function(u){return u.status==='فاضية';}).length;
  var expM=STATE.units.reduce(function(s,u){return s+(u.status==='مؤجرة'?monthly(u.rent,u.cycle):0);},0);
  var collected=sum(STATE.payments,'amount');
  var cards=[['عدد العقارات',STATE.properties.length,'c'],['الوحدات',STATE.units.length,'c'],['مؤجرة',occ,'g'],['فاضية',vac,'r'],['الإيجار الشهري المتوقع',f(expM)+' ر.س','gold'],['إجمالي المُحصّل',f(collected)+' ر.س','g'],['المستأجرون',STATE.tenants.length,'c']];
  g('dashCards').innerHTML=cards.map(function(c){return '<div class="card"><div class="lb">'+c[0]+'</div><div class="vl '+(c[2]==='gold'?'':c[2])+'">'+c[1]+'</div></div>';}).join('');
  var by={};STATE.payments.forEach(function(p){var u=STATE.units.find(function(x){return x.id===p.unitId;});var pn=u?(STATE.properties.find(function(y){return y.id===u.propId;})||{}).name:'غير محدد';by[pn||'غير محدد']=(by[pn||'غير محدد']||0)+(Number(p.amount)||0);});
  var labels=Object.keys(by),vals=labels.map(function(k){return by[k];});
  if(propChart)propChart.destroy();if(!labels.length)return;
  propChart=new Chart(g('chartProp'),{type:'bar',data:{labels:labels,datasets:[{data:vals,backgroundColor:'#b8921a',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9db3a3',font:{family:'Cairo'}},grid:{display:false}},y:{ticks:{color:'#9db3a3'},grid:{color:'rgba(255,255,255,.05)'}}}}});
}
/* ===== PROPERTIES + UNITS ===== */
function renderProps(){
  var el=g('propsList');
  if(!STATE.properties.length){el.innerHTML='<div class="empty">لا عقارات بعد — أضف أول عقار.</div>';return;}
  el.innerHTML=STATE.properties.map(function(p){
    var us=unitsOf(p.id);
    var rows=us.map(function(u){var tn=tenantName(u.tenantId);var st=u.status||'فاضية';var bc=st==='مؤجرة'?'on':st==='فاضية'?'off':'mnt';
      return '<tr><td>'+esc(u.no||'')+'</td><td>'+esc(u.floor||'')+'</td><td>'+f(u.rent)+'</td><td>'+esc(u.cycle||'')+'</td><td>'+(tn?esc(tn):'—')+'</td><td>'+fd(u.cStart)+' ← '+fd(u.cEnd)+'</td><td><span class="badge '+bc+'">'+esc(st)+'</span></td><td><button class="btn sm" onclick="openUnit(\''+p.id+'\',\''+u.id+'\')">تعديل</button> <button class="btn sm red" onclick="delUnit(\''+u.id+'\')">حذف</button></td></tr>';}).join('');
    return '<div class="propcard"><div class="ph"><h3>🏢 '+esc(p.name)+'</h3><span class="chip">'+us.length+' وحدة</span><span class="chip">مؤجرة '+us.filter(function(u){return u.status==="مؤجرة";}).length+'</span>'+(p.note?'<span class="chip">'+esc(p.note)+'</span>':'')+
      '<div style="margin-inline-start:auto;display:flex;gap:6px"><button class="btn sm gold" onclick="openUnit(\''+p.id+'\')">+ وحدة</button><button class="btn sm" onclick="openProp(\''+p.id+'\')">تعديل</button><button class="btn sm red" onclick="delProp(\''+p.id+'\')">حذف</button></div></div>'+
      (us.length?'<div class="tablewrap"><table><thead><tr><th>الوحدة</th><th>الدور</th><th>الإيجار</th><th>الدورية</th><th>المستأجر</th><th>العقد</th><th>الحالة</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty" style="padding:14px">لا وحدات — أضف وحدة.</div>')+'</div>';
  }).join('');
}
function closeModal(){g('modal').classList.remove('act');}
function showModal(h){g('modalBox').innerHTML=h;g('modal').classList.add('act');}
g('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function openProp(id){var p=id?STATE.properties.find(function(x){return x.id===id;}):null;
  showModal('<h3>'+(p?'تعديل عقار':'عقار جديد')+'</h3><label class="fld"><span>اسم العقار</span><input id="p_name" value="'+(p?esc(p.name):'')+'" placeholder="مثال: عمارة سعد القحطاني"></label><label class="fld"><span>ملاحظة (الموقع/الوصف)</span><input id="p_note" value="'+(p?esc(p.note||''):'')+'"></label><div style="display:flex;gap:8px"><button class="btn gold" onclick="saveProp(\''+(id||'')+'\')">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button></div>');}
function saveProp(id){var o={name:g('p_name').value.trim(),note:g('p_note').value.trim()};if(!o.name){toast('أدخل اسم العقار');return;}if(id){Object.assign(STATE.properties.find(function(x){return x.id===id;}),o);}else{o.id=uid();STATE.properties.push(o);}closeModal();persist();toast('تم الحفظ');}
function delProp(id){if(!confirm('حذف العقار وكل وحداته؟'))return;STATE.units=STATE.units.filter(function(u){return u.propId!==id;});STATE.properties=STATE.properties.filter(function(p){return p.id!==id;});persist();toast('تم الحذف');}
function openUnit(pid,id){var u=id?STATE.units.find(function(x){return x.id===id;}):null;
  var tenOpts='<option value="">— بدون —</option>'+STATE.tenants.map(function(t){return '<option value="'+t.id+'" '+(u&&u.tenantId===t.id?'selected':'')+'>'+esc(t.name)+'</option>';}).join('');
  showModal('<h3>'+(u?'تعديل وحدة':'وحدة جديدة')+'</h3><div class="grid2"><label class="fld"><span>رقم الوحدة</span><input id="u_no" value="'+(u?esc(u.no||''):'')+'"></label><label class="fld"><span>الدور</span><input id="u_floor" value="'+(u?esc(u.floor||''):'')+'"></label></div><div class="grid2"><label class="fld"><span>قيمة الإيجار</span><input type="number" id="u_rent" value="'+(u?u.rent:'')+'"></label><label class="fld"><span>الدورية</span><select id="u_cycle">'+CYCLES.map(function(c){return '<option '+(u&&u.cycle===c?'selected':'')+'>'+c+'</option>';}).join('')+'</select></label></div><div class="grid2"><label class="fld"><span>بداية العقد</span><input type="date" id="u_cs" value="'+(u?u.cStart||'':'')+'"></label><label class="fld"><span>نهاية العقد</span><input type="date" id="u_ce" value="'+(u?u.cEnd||'':'')+'"></label></div><div class="grid2"><label class="fld"><span>الحالة</span><select id="u_st">'+STATUSES.map(function(s){return '<option '+(u&&u.status===s?'selected':'')+'>'+s+'</option>';}).join('')+'</select></label><label class="fld"><span>المستأجر</span><select id="u_tenant">'+tenOpts+'</select></label></div><div style="display:flex;gap:8px"><button class="btn gold" onclick="saveUnit(\''+pid+'\',\''+(id||'')+'\')">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button></div>');}
function saveUnit(pid,id){var o={propId:pid,no:g('u_no').value.trim(),floor:g('u_floor').value.trim(),rent:Number(g('u_rent').value)||0,cycle:g('u_cycle').value,cStart:g('u_cs').value,cEnd:g('u_ce').value,status:g('u_st').value,tenantId:g('u_tenant').value};if(!o.no){toast('أدخل رقم الوحدة');return;}if(id){Object.assign(STATE.units.find(function(x){return x.id===id;}),o);}else{o.id=uid();STATE.units.push(o);}closeModal();persist();toast('تم الحفظ');}
function delUnit(id){if(!confirm('حذف الوحدة؟'))return;STATE.units=STATE.units.filter(function(u){return u.id!==id;});persist();toast('تم الحذف');}
/* ===== TENANTS ===== */
function renderTenants(){var t=g('tblTenants');if(!STATE.tenants.length){t.innerHTML='';var e=t.parentNode.querySelector('.empty');if(!e)t.insertAdjacentHTML('afterend','<div class="empty">لا مستأجرين بعد.</div>');return;}var e=t.parentNode.querySelector('.empty');if(e)e.remove();
  t.innerHTML='<thead><tr><th>الاسم</th><th>الجوال</th><th>رقم الهوية</th><th>الآيبان</th><th>رقم العقد</th><th>الوحدة</th><th></th></tr></thead><tbody>'+STATE.tenants.map(function(x){var u=STATE.units.find(function(y){return y.tenantId===x.id;});return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone||'')+'</td><td>'+esc(x.nid||'')+'</td><td style="font-size:11px">'+esc(x.iban||'')+'</td><td>'+esc(x.contract||'')+'</td><td>'+(u?esc(unitLabel(u)):'—')+'</td><td><button class="btn sm" onclick="openTenant(\''+x.id+'\')">تعديل</button> <button class="btn sm red" onclick="delTenant(\''+x.id+'\')">حذف</button></td></tr>';}).join('')+'</tbody>';}
function openTenant(id){var t=id?STATE.tenants.find(function(x){return x.id===id;}):null;showModal('<h3>'+(t?'تعديل مستأجر':'مستأجر جديد')+'</h3><div class="grid2"><label class="fld"><span>الاسم</span><input id="t_name" value="'+(t?esc(t.name):'')+'"></label><label class="fld"><span>الجوال</span><input id="t_phone" value="'+(t?esc(t.phone||''):'')+'"></label></div><div class="grid2"><label class="fld"><span>رقم الهوية</span><input id="t_nid" value="'+(t?esc(t.nid||''):'')+'"></label><label class="fld"><span>رقم العقد</span><input id="t_contract" value="'+(t?esc(t.contract||''):'')+'"></label></div><label class="fld"><span>الآيبان / الحساب البنكي</span><input id="t_iban" value="'+(t?esc(t.iban||''):'')+'" placeholder="SA.."></label><label class="fld"><span>ملاحظة</span><input id="t_note" value="'+(t?esc(t.note||''):'')+'"></label><div style="display:flex;gap:8px"><button class="btn gold" onclick="saveTenant(\''+(id||'')+'\')">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button></div>');}
function saveTenant(id){var o={name:g('t_name').value.trim(),phone:g('t_phone').value.trim(),nid:g('t_nid').value.trim(),contract:g('t_contract').value.trim(),iban:g('t_iban').value.trim().replace(/\s/g,''),note:g('t_note').value.trim()};if(!o.name){toast('أدخل الاسم');return;}if(id){Object.assign(STATE.tenants.find(function(x){return x.id===id;}),o);}else{o.id=uid();STATE.tenants.push(o);}closeModal();persist();toast('تم الحفظ');}

function exportTenants(){var wb=XLSX.utils.book_new();var ws=XLSX.utils.json_to_sheet(STATE.tenants.map(function(t){return{'الاسم':t.name,'الجوال':t.phone,'الهوية':t.nid,'الآيبان':t.iban,'العقد':t.contract};}));ws['!rtl']=true;XLSX.utils.book_append_sheet(wb,ws,'المستأجرون');XLSX.writeFile(wb,'المستأجرون.xlsx');}

g('bankFile').onchange=function(ev){var file=ev.target.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(e){try{
  var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];var aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
  var acct='';for(var i=0;i<Math.min(aoa.length,20);i++){var rr=aoa[i]||[];for(var kk=0;kk<rr.length;kk++){if(String(rr[kk]||'').indexOf('رقم الحساب')>=0){var av=String(rr[kk+1]!=null?rr[kk+1]:'').replace(/[^0-9]/g,'');if(av.length>=6)acct=av;}}}
  var hr=-1,ci={};for(var i=0;i<aoa.length;i++){var row=aoa[i]||[],j=row.join(' ');if(j.indexOf('تاريخ')>=0&&(j.indexOf('دائن')>=0||j.indexOf('إيداع')>=0||j.indexOf('تفاصيل')>=0)){hr=i;for(var k=0;k<row.length;k++){var s=String(row[k]||'');if(s.indexOf('تاريخ')>=0&&ci.date==null)ci.date=k;else if((s.indexOf('دائن')>=0||s.indexOf('إيداع')>=0)&&ci.credit==null)ci.credit=k;else if((s.indexOf('تفاصيل')>=0||s.indexOf('بيان')>=0)&&ci.desc==null)ci.desc=k;}break;}}
  if(hr<0){g('bankMsg').textContent='⚠️ لم أجد جدول الحركات';return;}
  var added=0;for(var i=hr+1;i<aoa.length;i++){var row=aoa[i]||[];var cr=parseFloat(String(row[ci.credit]!=null?row[ci.credit]:'').replace(/[^0-9.\-]/g,''));var dt=row[ci.date],ds=row[ci.desc];if((dt==null||dt==='')&&(ds==null||ds===''))continue;if(cr>0){STATE.bank.push({id:uid(),date:_bkD(dt),desc:String(ds||''),amount:cr,acct:acct,tenant:'',method:''});added++;}}
  bankMatch();persist();g('bankMsg').textContent='✓ أُضيف '+added+' إيداع'+(acct?(' — حساب '+acct):'');
}catch(err){g('bankMsg').textContent='تعذّرت القراءة: '+err.message;}};rd.readAsArrayBuffer(file);};
function _bkD(v){if(v==null||v==='')return'';var s=String(v);var m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(m)return m[3]+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);return s.slice(0,10);}
function _bkSig(b){return String(Math.round((b.amount||0)*100))+'|'+String(b.date||'')+'|'+String(b.desc||'').slice(0,30);}
function bankSetName(sig,val){if(val&&val.trim())STATE.bankNames[sig]=val.trim();else delete STATE.bankNames[sig];bankMatch();persist();}
function bankMatch(){var method=(g('bkMethod')&&g('bkMethod').value)||'auto';
  STATE.bank.forEach(function(b){b.tenant='';b.method='';var sig=_bkSig(b);
    if(STATE.bankNames[sig]){b.tenant=STATE.bankNames[sig];b.method='يدوي';return;}
    if(method==='manual')return;
    var dnorm=_norm(b.desc);
    if(method==='auto'||method==='iban'){for(var i=0;i<STATE.tenants.length;i++){var ib=String(STATE.tenants[i].iban||'').replace(/\s/g,'');if(ib&&ib.length>=8&&dnorm.indexOf(ib.toLowerCase())>=0){b.tenant=STATE.tenants[i].name;b.method='آيبان';return;}}}
    if(method==='auto'||method==='amt'){var mu=STATE.units.find(function(u){if(!u.tenantId)return false;var mr=monthly(u.rent,u.cycle);return Math.abs(mr-b.amount)<0.5 || Math.abs((Number(u.rent)||0)-b.amount)<0.5;});if(mu){b.tenant=tenantName(mu.tenantId);b.method='مبلغ';return;}}
  });}
function bankFil(fl){_bkFil=fl;['all','matched','unmatched'].forEach(function(x){var b=g('bf-'+x);if(b)b.classList.toggle('gold',x===fl);});rBank();}
function rBank(){var st=g('bankStats');if(!st)return;
  var from=(g('bkFrom')&&g('bkFrom').value)||'',to=(g('bkTo')&&g('bkTo').value)||'';
  var all=STATE.bank.filter(function(b){var d=b.date||'';if(from&&d&&d<from)return false;if(to&&d&&d>to)return false;return true;});
  var matched=all.filter(function(b){return b.tenant;}).length,totIn=sum(all,'amount');
  st.innerHTML='<div class="card"><div class="lb">عدد الإيداعات</div><div class="vl c">'+all.length+'</div></div><div class="card"><div class="lb">إجمالي الإيداعات</div><div class="vl gold">'+f(totIn)+'</div></div><div class="card"><div class="lb">مطابقة</div><div class="vl g">'+matched+'</div></div><div class="card"><div class="lb">غير مطابقة</div><div class="vl r">'+(all.length-matched)+'</div></div>';
  var list=all.filter(function(b){return _bkFil==='all'||(_bkFil==='matched'&&b.tenant)||(_bkFil==='unmatched'&&!b.tenant);});
  var h='<thead><tr><th>التاريخ</th><th>الحساب</th><th>البيان</th><th>المبلغ</th><th>المستأجر / الجهة</th><th>المطابقة</th></tr></thead><tbody>';
  if(!list.length)h+='<tr><td colspan="6" class="empty">لا بيانات — استورد كشف بنكي.</td></tr>';
  list.forEach(function(b){var sig=_bkSig(b);h+='<tr><td>'+esc(b.date)+'</td><td style="font-size:10px">'+esc(b.acct||'')+'</td><td style="font-size:10.5px;max-width:300px;white-space:normal;line-height:1.5">'+esc(String(b.desc))+'</td><td>'+f(b.amount)+'</td><td><input data-sig="'+esc(sig)+'" value="'+esc(b.tenant||'')+'" placeholder="اكتب الاسم…" style="min-width:150px"></td><td>'+(b.method?'<span class="badge on">'+esc(b.method)+'</span>':'<span class="badge" style="background:rgba(255,255,255,.05);color:var(--muted);font-size:10px">🏦 بنك '+esc(b.acct||'')+'</span>')+'</td></tr>';});
  g('bankTbl').innerHTML=h+'</tbody>';
}
g('bankTbl').addEventListener('change',function(ev){var inp=ev.target.closest&&ev.target.closest('input[data-sig]');if(inp)bankSetName(inp.getAttribute('data-sig'),inp.value);});
function bankExport(){var rows=STATE.bank.map(function(b){return{'التاريخ':b.date,'الحساب':b.acct,'البيان':b.desc,'المبلغ':b.amount,'الجهة':b.tenant||('بنك '+(b.acct||'')+' - '+b.date),'المطابقة':b.method||'بنك'};});var ws=XLSX.utils.json_to_sheet(rows);ws['!rtl']=true;var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'مطابقة البنك');XLSX.writeFile(wb,'مطابقة الكشف البنكي.xlsx');}
/* ===== REPORTS ===== */
function rep(kind){var b=g('repBody');
  if(kind==='income'){var by={};STATE.units.forEach(function(u){var p=STATE.properties.find(function(x){return x.id===u.propId;});var pn=p?p.name:'—';by[pn]=by[pn]||{units:0,exp:0,coll:0};by[pn].units++;by[pn].exp+=(u.status==='مؤجرة'?monthly(u.rent,u.cycle):0);});
    STATE.payments.forEach(function(p){var u=STATE.units.find(function(x){return x.id===p.unitId;});var pn=u?(STATE.properties.find(function(y){return y.id===u.propId;})||{}).name:'—';if(by[pn])by[pn].coll+=(Number(p.amount)||0);});
    var h='<table><thead><tr><th>العقار</th><th>الوحدات</th><th>الإيجار الشهري المتوقع</th><th>المُحصّل</th></tr></thead><tbody>';Object.keys(by).forEach(function(k){h+='<tr><td>'+esc(k)+'</td><td>'+by[k].units+'</td><td>'+f(by[k].exp)+'</td><td>'+f(by[k].coll)+'</td></tr>';});b.innerHTML=h+'</tbody></table>';}
  else if(kind==='monthly'){var mt={};STATE.payments.forEach(function(p){var k=(p.date||'').slice(0,7);if(k)mt[k]=(mt[k]||0)+(Number(p.amount)||0);});STATE.bank.forEach(function(x){var k=(x.date||'').slice(0,7);if(k)mt['بنك:'+k]=(mt['بنك:'+k]||0)+(Number(x.amount)||0);});
    var keys=Object.keys(mt).sort();var h='<table><thead><tr><th>الشهر</th><th>المبلغ</th></tr></thead><tbody>';keys.forEach(function(k){h+='<tr><td>'+esc(k)+'</td><td>'+f(mt[k])+'</td></tr>';});b.innerHTML=keys.length?h+'</tbody></table>':'<div class="empty">لا دفعات مسجّلة.</div>';}
  else if(kind==='late'){var todd=today();var late=STATE.units.filter(function(u){return u.status==='مؤجرة'&&u.cEnd&&u.cEnd<todd;});var h='<table><thead><tr><th>الوحدة</th><th>المستأجر</th><th>نهاية العقد</th><th>الحالة</th></tr></thead><tbody>';STATE.units.filter(function(u){return u.status==='مؤجرة';}).forEach(function(u){var over=u.cEnd&&u.cEnd<todd;h+='<tr><td>'+esc(unitLabel(u))+'</td><td>'+esc(tenantName(u.tenantId))+'</td><td>'+fd(u.cEnd)+'</td><td>'+(over?'<span class="badge off">منتهٍ</span>':'<span class="badge on">ساري</span>')+'</td></tr>';});b.innerHTML=STATE.units.filter(function(u){return u.status==='مؤجرة';}).length?h+'</tbody></table>':'<div class="empty">لا وحدات مؤجرة.</div>';}
  else if(kind==='recon'){var m=STATE.bank.filter(function(x){return x.tenant;}),um=STATE.bank.filter(function(x){return !x.tenant;});b.innerHTML='<div class="cards"><div class="card"><div class="lb">مطابقة (منصة/معروفة)</div><div class="vl g">'+m.length+' — '+f(sum(m,"amount"))+'</div></div><div class="card"><div class="lb">غير مطابقة (مباشر/بنك)</div><div class="vl r">'+um.length+' — '+f(sum(um,"amount"))+'</div></div></div><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>الجهة</th></tr></thead><tbody>'+STATE.bank.map(function(x){return '<tr><td>'+esc(x.date)+'</td><td>'+f(x.amount)+'</td><td>'+(x.tenant?esc(x.tenant):'<span style="color:var(--muted)">بنك '+esc(x.acct||'')+'</span>')+'</td></tr>';}).join('')+'</tbody></table>';}
}
/* ===== استيراد بيانات المنصة (إيجار) ===== */
(function(){var fi=g('ejarFile');if(!fi)return;fi.onchange=function(ev){var file=ev.target.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(e){try{
  var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
  var shName=wb.SheetNames.filter(function(n){return n.indexOf('العقود')>=0;})[0]||wb.SheetNames.filter(function(n){return n.indexOf('الوحدات')>=0;})[0]||wb.SheetNames[0];
  var ws=wb.Sheets[shName];var aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
  var hr=-1;for(var i=0;i<aoa.length;i++){var j=(aoa[i]||[]).join(' ');if(j.indexOf('المستأجر')>=0&&j.indexOf('الوحدة')>=0){hr=i;break;}}
  if(hr<0){g('ejarMsg').textContent='لم أجد جدول العقود في الملف';return;}
  var H=(aoa[hr]||[]).map(function(x){return String(x||'').trim();});
  function col(ns){for(var i=0;i<H.length;i++)for(var k=0;k<ns.length;k++)if(H[i].indexOf(ns[k])>=0)return i;return -1;}
  var ci={no:col(['الوحدة']),floor:col(['الطابق']),status:col(['الحالة']),name:col(['المستأجر']),nid:col(['الهوية']),phone:col(['الجوال']),rent:col(['الإيجار','الايجار']),cycle:col(['الوتيرة','الدورية']),cs:col(['بداية']),ce:col(['نهاية']),contract:col(['رقم العقد']),iban:col(['الآيبان','الايبان'])};
  var pName=(function(){try{var sm=wb.SheetNames.filter(function(n){return n.indexOf('ملخص')>=0;})[0];if(sm){var a2=XLSX.utils.sheet_to_json(wb.Sheets[sm],{header:1,raw:false});for(var i=0;i<a2.length;i++){if(String((a2[i]||[])[0]||'')==='العقار')return String(a2[i][1]||'').trim();}}}catch(e){}return 'عمارة سعد القحطاني';})();
  var prop=STATE.properties.filter(function(p){return p.name===pName;})[0];if(!prop){prop={id:uid(),name:pName,note:'مستورد من منصة إيجار'};STATE.properties.push(prop);}
  var tC=0,uC=0,byUnit={};
  for(var i=hr+1;i<aoa.length;i++){var r=aoa[i]||[];var nm=String(r[ci.name]||'').trim();var uno=String(r[ci.no]||'').trim();if(!nm&&!uno)continue;
    var st=String(r[ci.status]||'').trim();var active=(st.indexOf('ملغ')<0&&st.indexOf('منته')<0&&st.indexOf('منتهي')<0);
    var iban=String(r[ci.iban]||'').replace(/\s/g,'');var nid=String(r[ci.nid]||'').trim();
    var ten=null;if(nm){ten=STATE.tenants.filter(function(t){return t.name===nm&&(t.nid===nid||!nid||!t.nid);})[0];if(!ten){ten={id:uid(),name:nm,phone:String(r[ci.phone]||'').trim(),nid:nid,iban:iban,contract:String(r[ci.contract]||'').trim(),note:''};STATE.tenants.push(ten);tC++;}}
    if(!uno)continue;var ro={no:uno,floor:String(r[ci.floor]||'').trim(),rent:parseFloat(String(r[ci.rent]||'').replace(/[^0-9.]/g,''))||0,cycle:String(r[ci.cycle]||'شهري').trim()||'شهري',cStart:_bkD(r[ci.cs]),cEnd:_bkD(r[ci.ce]),status:active?'مؤجرة':'فاضية',tenantId:active&&ten?ten.id:'',_active:active};
    if(!byUnit[uno]||(active&&!byUnit[uno]._active))byUnit[uno]=ro;
  }
  Object.keys(byUnit).forEach(function(k){var ro=byUnit[k];delete ro._active;ro.propId=prop.id;var ex=STATE.units.filter(function(u){return u.propId===prop.id&&u.no===ro.no;})[0];if(ex)Object.assign(ex,ro);else{ro.id=uid();STATE.units.push(ro);uC++;}});
  persist();g('ejarMsg').textContent='✓ '+tC+' مستأجر، '+uC+' وحدة في «'+pName+'»';toast('تم استيراد بيانات المنصة');
}catch(err){g('ejarMsg').textContent='تعذّر: '+err.message;}};rd.readAsArrayBuffer(file);};})();

window.addEventListener('load',function(){setTimeout(function(){var s=g('splash');if(s){s.style.opacity='0';setTimeout(function(){s.style.display='none';},500);}},900);setSync('');initFB();});
</script>
